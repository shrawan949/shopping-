<!DOCTYPE html>
<html>
<head>

<title>Add Product</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h2>Add Product</h2>

<form id="productForm">

<input
type="text"
id="name"
placeholder="Product Name"
required>

<br><br>

<input
type="text"
id="description"
placeholder="Description"
required>

<br><br>

<input
type="number"
id="price"
placeholder="Price"
required>

<br><br>

<input
type="number"
id="quantity"
placeholder="Quantity"
required>

<br><br>

<button type="submit">
Save Product
</button>

</form>

<script src="js/addProduct.js"></script>

</body>
</html>
